[package]
name = "gitnest"
version = "1.0.1"
edition = "2021"
authors = ["GitNest Team"]
description = "One Workspace. Multiple Git Identities."
license = "MIT"
homepage = "https://github.com/siranjeevan/GitNest"
repository = "https://github.com/siranjeevan/GitNest"
documentation = "https://github.com/siranjeevan/GitNest"
readme = "README.md"
keywords = ["git", "ssh", "identity", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
directories = "5.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }
rand = "0.8"
zeroize = "1.7"
keyring = "2.1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.35", features = ["full"] }
tempfile = "3.8"
async-trait = "0.1"
zip = "0.6"
sysinfo = "0.30"
walkdir = "2.4"
open = "5.0"
arboard = "3.3"
comfy-table = "7.1"
dialoguer = "0.11"
sha2 = "0.10"
ratatui = "0.26"
crossterm = "0.27"
dotenvy = "0.15.7"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
